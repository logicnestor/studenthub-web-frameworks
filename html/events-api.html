
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StudentHub | AJAX Event Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body { background: #f5f7fb; }
        .main-card { border: 0; border-radius: 14px; }
        .status-message { display: none; }
        .event-description { max-width: 280px; white-space: pre-wrap; }
        .form-label { font-weight: 500; }
    </style>
</head>
<body>
<div class="container py-4 py-md-5">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <div>
            <h1 class="h3 mb-1">AJAX Event Management</h1>
            <p class="text-secondary mb-0">
                Manage events without refreshing the page.
            </p>
        </div>
        <a href="admin-dashboard.php" class="btn btn-outline-secondary">
            Admin Dashboard
        </a>
    </div>

    <div id="message" class="alert status-message" role="alert"
         aria-live="polite"></div>

    <div class="card main-card shadow-sm mb-4">
        <div class="card-body p-4">
            <h2 id="form-heading" class="h5 mb-3">Add Event</h2>

            <form id="event-form">
                <input type="hidden" id="event-id">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="title" class="form-label">Event Title *</label>
                        <input id="title" class="form-control" maxlength="150" required>
                    </div>

                    <div class="col-md-6">
                        <label for="category" class="form-label">Category *</label>
                        <input id="category" class="form-control" maxlength="100"
                               required placeholder="Workshop, Seminar, Sports">
                    </div>

                    <div class="col-md-4">
                        <label for="event-date" class="form-label">Event Date *</label>
                        <input type="date" id="event-date" class="form-control" required>
                    </div>

                    <div class="col-md-4">
                        <label for="location" class="form-label">Location *</label>
                        <input id="location" class="form-control" maxlength="255" required>
                    </div>

                    <div class="col-md-4">
                        <label for="event-status" class="form-label">Status *</label>
                        <select id="event-status" class="form-select" required>
                            <option value="open">Open</option>
                            <option value="closed">Closed</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label for="description" class="form-label">Description *</label>
                        <textarea id="description" class="form-control" rows="3"
                                  required></textarea>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button id="save-button" type="submit" class="btn btn-primary">
                        Save Event
                    </button>
                    <button id="cancel-edit" type="button"
                            class="btn btn-outline-secondary" hidden>
                        Cancel Edit
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="card main-card shadow-sm">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                <h2 class="h5 mb-0">Events</h2>
                <button id="refresh-button" class="btn btn-outline-primary">
                    Refresh List
                </button>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="search" class="form-label">Search events</label>
                    <input type="search" id="search" class="form-control"
                           placeholder="Search title, location, description">
                </div>
                <div class="col-md-3">
                    <label for="category-filter" class="form-label">Category</label>
                    <select id="category-filter" class="form-select">
                        <option value="">All categories</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="status-filter" class="form-label">Status</label>
                    <select id="status-filter" class="form-select">
                        <option value="">All statuses</option>
                        <option value="open">Open</option>
                        <option value="closed">Closed</option>
                    </select>
                </div>
            </div>

            <p id="loading" class="text-secondary" hidden>Loading events...</p>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Location</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="events-table">
                        <tr>
                            <td colspan="7" class="text-center text-secondary">
                                Events will appear here.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="events-api.js"></script>
</body>
</html>
